{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if error %}<p class="error" id="login-error">{{ error }}</p>{% endif %}
<form method="post" action="/login">
  <p><label>Username <input id="username" name="username" required></label></p>
  <p><label>Password <input id="password" name="password" type="password" required></label></p>
  <button id="login-submit" type="submit">Log in</button>
</form>
{% endblock %}
